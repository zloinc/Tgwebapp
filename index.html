<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ipoStas'b Knowledgebase</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            background-image: url('IMG_0570.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: #111827;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .card-bg {
            background-color: rgba(31, 41, 55, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .bottom-nav {
            background-color: rgba(17, 24, 39, 0.9);
            backdrop-filter: blur(15px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .accent-text { color: #60a5fa; }
        .section { display: none; }
        .section.active { display: block; animation: fadeIn 0.3s ease-out; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes disco {
            0% { background: linear-gradient(45deg, #ff0080, #7928ca); }
            33% { background: linear-gradient(45deg, #0070f3, #00dfd8); }
            66% { background: linear-gradient(45deg, #f59e0b, #ef4444); }
            100% { background: linear-gradient(45deg, #ff0080, #7928ca); }
        }

        .animate-disco {
            animation: disco 3s infinite alternate;
            background-size: 200% 200%;
        }
    </style>
</head>
<body class="pb-24 overflow-x-hidden">
    <main id="app" data-content-src="content.json">
        <div id="about" class="section active p-6"></div>
        <div id="tutorials" class="section p-4"></div>
        <div id="plugins" class="section p-4"></div>
        <div id="bots" class="section p-4"></div>
        <div id="secret" class="section p-0 h-screen relative overflow-hidden"></div>
    </main>

    <div class="bottom-nav fixed bottom-0 w-full flex justify-between px-2 py-3 z-50">
        <button onclick="showSection('about')" id="btn-about" class="nav-btn flex flex-col items-center w-1/4 text-gray-400 transition-colors">
            <span class="text-xl mb-1">👤</span>
            <span class="text-[8px] font-bold uppercase tracking-tighter">Кто я?</span>
        </button>
        <button onclick="showSection('tutorials')" id="btn-tutorials" class="nav-btn flex flex-col items-center w-1/4 text-gray-400 transition-colors">
            <span class="text-xl mb-1">🎬</span>
            <span class="text-[8px] font-bold uppercase tracking-tighter">Дудориалы</span>
        </button>
        <button onclick="showSection('plugins')" id="btn-plugins" class="nav-btn flex flex-col items-center w-1/4 text-gray-400 transition-colors">
            <span class="text-xl mb-1">🧩</span>
            <span class="text-[8px] font-bold uppercase tracking-tighter">Плагины</span>
        </button>
        <button onclick="showSection('bots')" id="btn-bots" class="nav-btn flex flex-col items-center w-1/4 text-gray-400 transition-colors">
            <span class="text-xl mb-1">🤖</span>
            <span class="text-[8px] font-bold uppercase tracking-tighter">Боты</span>
        </button>
    </div>

    <script src="app.js"></script>
</body>
</html>
